context /watchparty/web/ {
  location                $DOC_ROOT/watchparty/web/
  allowBrowse             1
  addDefaultCharset       off
  extraHeaders            <<<END_extraHeaders
Content-Security-Policy: default-src 'none'; script-src 'self' https://www.youtube.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self' wss://cp.praivox.com; media-src 'self' https: blob:; img-src 'self' data: https://i.ytimg.com; style-src 'self'; font-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests
X-Frame-Options: DENY
X-Content-Type-Options: nosniff
Referrer-Policy: strict-origin-when-cross-origin
Permissions-Policy: microphone=(self), camera=(), geolocation=(), payment=(), usb=(), autoplay=(self "https://www.youtube.com"), fullscreen=(self "https://www.youtube.com"), encrypted-media=(self "https://www.youtube.com"), picture-in-picture=(self "https://www.youtube.com")
Cross-Origin-Opener-Policy: same-origin
Strict-Transport-Security: max-age=31536000
  END_extraHeaders
}
